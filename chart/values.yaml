# Default values for the hermes chart.
# This is a YAML-formatted file. Declare variables to be passed into your templates.
#
# Runtime contract (verified against the official `nousresearch/hermes-agent`
# image — see the "Hermes runtime contract" section of the README):
#   * One image runs BOTH the gateway and (optionally) the dashboard. The image's
#     s6-overlay init starts as root to chown/seed `/opt/data`, then drops every
#     supervised service to the `hermes` user (uid/gid 10000).
#   * The gateway API server (OpenAI-compatible + `GET /health`) listens on 8642.
#   * The dashboard listens on 9119 and is enabled with `HERMES_DASHBOARD=1`.

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

## Service account configuration (used by the gateway workload)
serviceAccount:
  create: true
  annotations: {}
  name: ""

## Common labels/annotations applied to all resources
commonLabels: {}
commonAnnotations: {}

## Pod-level settings applied to the gateway workload
podAnnotations: {}
podLabels: {}

## Node and affinity settings applied to the gateway workload
nodeSelector: {}
tolerations: []
affinity: {}

## The single Hermes image used by the gateway (and its in-pod dashboard).
## The official image is `nousresearch/hermes-agent`. Pin `tag` for production.
image:
  repository: nousresearch/hermes-agent
  tag: "latest"
  pullPolicy: IfNotPresent

## ---------- Hermes Gateway ----------
## One pod runs the Hermes agent (`gateway run`). The dashboard is a supervised
## s6 service inside the SAME container (see `gateway.dashboard`), not a separate
## workload — the official image requires a shared PID/network namespace for the
## dashboard's gateway-liveness detection. The gateway itself is a StatefulSet
## (Hermes is stateful: its self-managed filesystem state is single-writer).
gateway:
  enabled: true
  replicaCount: 1
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  command: ["gateway", "run"]
  args: []
  env: []
  envFrom: []

  ## OpenAI-compatible API server (also serves the health endpoint). Requires a
  ## `key` of at least 16 chars to start — the Hermes image silently refuses keys
  ## shorter than 16, leaving no listener on 8642 (pod crash-loops). The chart
  ## fails at render time if a shorter `key` is set (unless `keySecretRef.name` is
  ## set, in which case the external Secret's value cannot be length-validated at
  ## render time). Prefer `keySecretRef` (or the shared
  ## `secret.stringData.API_SERVER_KEY`) over a plaintext `key`.
  ##
  ## `enabled: false` tells the chart to stop managing the API server: it sets
  ## `API_SERVER_ENABLED=false`, omits the host/port/key/cors env, and drops the
  ## liveness/readiness probes and the `helm test` hook (they target `/health` on
  ## the API server port, which is no longer guaranteed to be listening). NOTE:
  ## the Hermes image starts the API server whenever a valid (16+ char)
  ## `API_SERVER_KEY` is present in the environment and *ignores*
  ## `API_SERVER_ENABLED` (verified empirically), so to truly disable it you must
  ## also ensure no `API_SERVER_KEY` reaches the container (e.g. leave
  ## `secret.stringData.API_SERVER_KEY`, `gateway.env`, and `gateway.envFrom`
  ## clear of it).
  apiServer:
    enabled: true
    host: "0.0.0.0"
    port: 8642
    key: ""
    keySecretRef:
      name: ""
      key: API_SERVER_KEY
    corsOrigins: ""

  ports:
    - name: api
      containerPort: 8642
      protocol: TCP

  service:
    type: ClusterIP
    port: 8642
    targetPort: api
    annotations: {}
    extraPorts: []

  serviceAccount:
    create: null
    name: ""
    annotations: null

  ## Documented minimums: 1 GB RAM / 1 core (2 GB if browser tools are used).
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: null

  ## The API server exposes `GET /health` (and `GET /v1/health`). With a valid
  ## >=16-char key it responds HTTP 200 on a fresh, unconfigured install — the pod
  ## becomes Ready immediately. With no key (or a <16-char key) the API server
  ## never binds, so `/health` is connection-refused and the pod fails its probes
  ## (crash-loop) while the gateway process itself keeps running.
  ## These probes (and the `helm test` hook) are rendered only when
  ## `apiServer.enabled` is true, since they target the API server's `/health`.
  livenessProbe:
    enabled: true
    path: /health
    port: api
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readinessProbe:
    enabled: true
    path: /health
    port: api
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  startupProbe: {}

  ## In-pod dashboard, supervised by s6-overlay alongside the gateway. On a
  ## non-loopback bind the dashboard fails closed until an auth provider is
  ## configured (basic auth / OAuth / OIDC) — see the README.
  dashboard:
    enabled: false
    host: "0.0.0.0"
    port: 9119
    service:
      type: ClusterIP
      port: 9119
      targetPort: dashboard
      annotations: {}
      extraPorts: []
    auth:
      basicAuth:
        username: ""
        password: ""
        secret: ""

  ## Pod-level securityContext. The image MUST start as root so s6-overlay can
  ## chown the data volume and drop to uid 10000; do NOT set runAsUser/runAsNonRoot
  ## here. `fsGroup` matches the `hermes` user so the PVC is group-writable even
  ## if the image's internal chown is skipped.
  podSecurityContext:
    fsGroup: 10000
    seccompProfile:
      type: RuntimeDefault

  ## Container-level securityContext. readOnlyRootFilesystem is safe because the
  ## image keeps its install tree (`/opt/hermes`) immutable itself, and the chart
  ## mounts writable scratch volumes for `/run` (s6) and `/tmp` (see `scratch`).
  ##
  ## The image's s6-overlay init MUST start as root to chown/seed `/opt/data` and
  ## then drop every supervised service to uid/gid 10000. That bootstrap needs
  ## CAP_CHOWN (chown the volume), CAP_DAC_OVERRIDE (seed first-boot files) and
  ## CAP_SETUID/CAP_SETGID (setuid/setgroups to the hermes user). Dropping ALL
  ## capabilities outright breaks the s6 bootstrap (`s6-applyuidgid: ... Operation
  ## not permitted`, container exits 111), so we drop ALL and add back only those
  ## four — the resulting set is exactly {CHOWN, DAC_OVERRIDE, SETGID, SETUID}.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
      add:
        - CHOWN
        - DAC_OVERRIDE
        - SETGID
        - SETUID

  ## Writable scratch volumes required under readOnlyRootFilesystem: true.
  ## s6-overlay writes (and executes from) `/run`; the runtime uses `/tmp`.
  ## `/run` must be a disk-backed emptyDir — a tmpfs `medium: Memory` is mounted
  ## noexec and breaks s6-overlay's runtime binaries.
  scratch:
    run:
      enabled: true
      emptyDir: {}
    tmp:
      enabled: true
      emptyDir: {}

  priorityClassName: ""
  topologySpreadConstraints: []

  ## Durable storage for Hermes self-managed state. Hermes writes config.yaml,
  ## .env, SOUL.md, state.db (SQLite), sessions/, memories/, skills/, cron/, logs/
  ## under HERMES_HOME, which the chart points at `mountPath` (the official layout
  ## uses `/opt/data`). A ReadWriteOnce volume attaches to one pod, so with
  ## persistence enabled the gateway is a single-replica StatefulSet that scales
  ## to at most one pod (enforced at render time and by the HPA guard). The
  ## default `updateStrategy: RollingUpdate` on a single replica terminates the
  ## old pod before the new one starts, preserving the single-writer contract.
  ##
  ## The chart-created PVC is annotated `helm.sh/resource-policy: keep`, so
  ## `helm uninstall` leaves the PVC (and the agent's managed state) in place
  ## rather than deleting it. To permanently purge state, delete the PVC manually
  ## (`kubectl delete pvc <release>-gateway`).
  ##
  ## When persistence is disabled the chart mounts an ephemeral emptyDir at
  ## `mountPath` so Hermes still has a writable state directory under
  ## readOnlyRootFilesystem (the image's own VOLUME is Docker-only; kubelet does
  ## not mount it). State is then lost on pod restart — use only for stateless
  ## evaluation, and note that disabling persistence on an existing release (an
  ## `helm upgrade` that flips `enabled: false`) silently orphans the PVC and boots
  ## the agent with a fresh, empty state. Reuse `existingClaim` to reattach.
  persistence:
    enabled: true
    mountPath: /opt/data
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 2Gi
    annotations: {}
    selector: {}
    subPath: ""

  extraVolumes: []
  extraVolumeMounts: []
  lifecycle: {}
  terminationGracePeriodSeconds: 30
  updateStrategy: {}

## Shared config / secret material, wired into the gateway container as envFrom.
## API keys and API_SERVER_KEY are read by Hermes directly from environment
## variables, so `secret.stringData` is the recommended way to supply them.
config:
  enabled: true
  data: {}
  annotations: {}

secret:
  enabled: false
  data: {}
  stringData: {}
  annotations: {}
  type: Opaque

## Ingress for exposing the gateway API (and dashboard) services
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hermes.example.com
      paths:
        - path: /
          pathType: Prefix
          service: gateway
          port: api
  tls: []

## PodDisruptionBudget for the gateway workload
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

## NetworkPolicy (default-deny; same-namespace + DNS egress allowed). Default-deny
## egress also blocks the gateway's outbound calls to external model APIs, so when
## you enable it you must add an egress rule for the providers you use — e.g.:
##   networkPolicy:
##     enabled: true
##     extraEgressRules:
##       - to:
##           - ipBlock:
##               cidr: 0.0.0.0/0
##               except: [169.254.169.254/32]
##         ports:
##           - protocol: TCP
##             port: 443
## (For a tighter policy, replace the 0.0.0.0/0 CIDR with the provider's IP ranges
## or a namespaceSelector for an egress proxy.)
networkPolicy:
  enabled: false
  extraIngressRules: []
  extraEgressRules: []
