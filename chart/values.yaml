# Default values for the hermes chart.
# This is a YAML-formatted file. Declare variables to be passed into your templates.
#
# Runtime contract (verified against the official `nousresearch/hermes-agent`
# image — see the "Hermes runtime contract" section of the README):
#   * One image runs BOTH the gateway and (optionally) the dashboard. The image's
#     s6-overlay init starts as root to chown/seed `/opt/data`, then drops every
#     supervised service to the `hermes` user (uid/gid 10000).
#   * The gateway API server (OpenAI-compatible + `GET /health`) listens on 8642.
#   * The dashboard listens on 9119 and is enabled with `HERMES_DASHBOARD=1`.

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

## Service account configuration (used by the gateway workload)
serviceAccount:
  create: true
  annotations: {}
  name: ""

## Common labels/annotations applied to all resources
commonLabels: {}
commonAnnotations: {}

## Pod-level settings applied to the gateway workload
podAnnotations: {}
podLabels: {}

## Node and affinity settings applied to the gateway workload
nodeSelector: {}
tolerations: []
affinity: {}

## The single Hermes image used by the gateway (and its in-pod dashboard).
## The official image is `nousresearch/hermes-agent`. Pin `tag` for production.
image:
  repository: nousresearch/hermes-agent
  tag: "latest"
  pullPolicy: IfNotPresent

## ---------- Hermes Gateway ----------
## One pod runs the Hermes agent (`gateway run`). The dashboard is a supervised
## s6 service inside the SAME container (see `gateway.dashboard`), not a separate
## Deployment — the official image requires a shared PID/network namespace for the
## dashboard's gateway-liveness detection.
gateway:
  enabled: true
  replicaCount: 1
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  command: ["gateway", "run"]
  args: []
  env: []
  envFrom: []

  ## OpenAI-compatible API server (also serves the health endpoint). Requires a
  ## `key` (min 8 chars) to start; Hermes fails closed without it. Prefer
  ## `keySecretRef` (or the shared `secret.stringData.API_SERVER_KEY`) over `key`.
  apiServer:
    enabled: true
    host: "0.0.0.0"
    port: 8642
    key: ""
    keySecretRef:
      name: ""
      key: API_SERVER_KEY
    corsOrigins: ""

  ports:
    - name: api
      containerPort: 8642
      protocol: TCP

  service:
    type: ClusterIP
    port: 8642
    targetPort: api
    annotations: {}
    extraPorts: []

  serviceAccount:
    create: null
    name: ""
    annotations: null

  ## Documented minimums: 1 GB RAM / 1 core (2 GB if browser tools are used).
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: null

  ## The API server exposes `GET /health` (and `GET /v1/health`). It only responds
  ## once Hermes is configured with a model/provider; until then the pod reports
  ## NotReady but the gateway process itself keeps running.
  livenessProbe:
    enabled: true
    path: /health
    port: api
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readinessProbe:
    enabled: true
    path: /health
    port: api
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  startupProbe: {}

  ## In-pod dashboard, supervised by s6-overlay alongside the gateway. On a
  ## non-loopback bind the dashboard fails closed until an auth provider is
  ## configured (basic auth / OAuth / OIDC) — see the README.
  dashboard:
    enabled: false
    host: "0.0.0.0"
    port: 9119
    service:
      type: ClusterIP
      port: 9119
      targetPort: dashboard
      annotations: {}
      extraPorts: []
    auth:
      basicAuth:
        username: ""
        password: ""
        secret: ""

  ## Pod-level securityContext. The image MUST start as root so s6-overlay can
  ## chown the data volume and drop to uid 10000; do NOT set runAsUser/runAsNonRoot
  ## here. `fsGroup` matches the `hermes` user so the PVC is group-writable even
  ## if the image's internal chown is skipped.
  podSecurityContext:
    fsGroup: 10000
    seccompProfile:
      type: RuntimeDefault

  ## Container-level securityContext. readOnlyRootFilesystem is safe because the
  ## image keeps its install tree (`/opt/hermes`) immutable itself, and the chart
  ## mounts writable scratch volumes for `/run` (s6) and `/tmp` (see `scratch`).
  ##
  ## The image's s6-overlay init MUST start as root to chown/seed `/opt/data` and
  ## then drop every supervised service to uid/gid 10000. That bootstrap needs
  ## CAP_CHOWN (chown the volume), CAP_DAC_OVERRIDE (seed first-boot files) and
  ## CAP_SETUID/CAP_SETGID (setuid/setgroups to the hermes user). Dropping ALL
  ## capabilities outright breaks the s6 bootstrap (`s6-applyuidgid: ... Operation
  ## not permitted`, container exits 111), so we drop ALL and add back only those
  ## four — the resulting set is exactly {CHOWN, DAC_OVERRIDE, SETGID, SETUID}.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
      add:
        - CHOWN
        - DAC_OVERRIDE
        - SETGID
        - SETUID

  ## Writable scratch volumes required under readOnlyRootFilesystem: true.
  ## s6-overlay writes (and executes from) `/run`; the runtime uses `/tmp`.
  ## `/run` must be a disk-backed emptyDir — a tmpfs `medium: Memory` is mounted
  ## noexec and breaks s6-overlay's runtime binaries.
  scratch:
    run:
      enabled: true
      emptyDir: {}
    tmp:
      enabled: true
      emptyDir: {}

  priorityClassName: ""
  topologySpreadConstraints: []

  ## Durable storage for Hermes self-managed state. Hermes writes config.yaml,
  ## .env, SOUL.md, state.db (SQLite), sessions/, memories/, skills/, cron/, logs/
  ## under HERMES_HOME, which the chart points at `mountPath` (the official layout
  ## uses `/opt/data`). A ReadWriteOnce volume attaches to one pod, so with
  ## persistence enabled the gateway runs a single replica with a `Recreate`
  ## rollout (see `strategy`).
  persistence:
    enabled: true
    mountPath: /opt/data
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 2Gi
    annotations: {}
    selector: {}
    subPath: ""

  extraVolumes: []
  extraVolumeMounts: []
  lifecycle: {}
  terminationGracePeriodSeconds: 30
  strategy: {}

## Shared config / secret material, wired into the gateway container as envFrom.
## API keys and API_SERVER_KEY are read by Hermes directly from environment
## variables, so `secret.stringData` is the recommended way to supply them.
config:
  enabled: true
  data: {}
  annotations: {}

secret:
  enabled: false
  data: {}
  stringData: {}
  annotations: {}
  type: Opaque

## Ingress for exposing the gateway API (and dashboard) services
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hermes.example.com
      paths:
        - path: /
          pathType: Prefix
          service: gateway
          port: api
  tls: []

## PodDisruptionBudget for the gateway workload
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

## NetworkPolicy (default-deny; same-namespace + DNS egress allowed)
networkPolicy:
  enabled: false
  extraIngressRules: []
  extraEgressRules: []
