{{- $root := . }}
{{- $components := list (dict "name" "gateway" "values" .Values.gateway) (dict "name" "dashboard" "values" .Values.dashboard) }}
{{- range $components }}
{{- if and .values.enabled .values.autoscaling.enabled (or .values.autoscaling.targetCPUUtilizationPercentage .values.autoscaling.targetMemoryUtilizationPercentage) }}
{{- $component := .name }}
{{- $compValues := .values }}
{{- with $root }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "hermes.fullname" . }}-{{ $component }}
  labels:
    {{- include "hermes.componentLabels" (merge (deepCopy .) (dict "component" $component)) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "hermes.fullname" . }}-{{ $component }}
  minReplicas: {{ $compValues.autoscaling.minReplicas }}
  maxReplicas: {{ $compValues.autoscaling.maxReplicas }}
  metrics:
    {{- if $compValues.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $compValues.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $compValues.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $compValues.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
