{{- if and .Values.gateway.enabled .Values.gateway.autoscaling.enabled (or .Values.gateway.autoscaling.targetCPUUtilizationPercentage .Values.gateway.autoscaling.targetMemoryUtilizationPercentage) }}
{{- if and .Values.gateway.persistence.enabled (gt (int .Values.gateway.autoscaling.maxReplicas) 1) }}
{{- fail "gateway.persistence is a ReadWriteOnce volume that can attach to only one pod at a time. Set gateway.autoscaling.maxReplicas: 1 (or disable autoscaling) while persistence is enabled." }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "hermes.fullname" . }}-gateway
  labels:
    {{- include "hermes.componentLabels" (merge (deepCopy .) (dict "component" "gateway")) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "hermes.fullname" . }}-gateway
  minReplicas: {{ .Values.gateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gateway.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.gateway.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.gateway.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.gateway.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.gateway.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
