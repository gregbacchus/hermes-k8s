{{- if .Values.gateway.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermes.fullname" . }}-gateway
  labels:
    {{- include "hermes.componentLabels" (merge (deepCopy .) (dict "component" "gateway")) | nindent 4 }}
  {{- $ann := merge (deepCopy (.Values.gateway.service.annotations | default dict)) (.Values.commonAnnotations | default dict) }}
  {{- if $ann }}
  annotations:
    {{- toYaml $ann | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    {{- $tp := .Values.gateway.service.targetPort }}
    {{- $numeric := regexMatch "^[0-9]+$" (toString $tp) }}
    - name: api
      port: {{ .Values.gateway.service.port }}
      targetPort: {{ if $numeric }}{{ int $tp }}{{ else }}{{ $tp }}{{ end }}
      protocol: TCP
    {{- range .Values.gateway.service.extraPorts }}
    - {{ toYaml . | nindent 6 | trimPrefix "  " }}
    {{- end }}
  selector:
    {{- include "hermes.componentSelectorLabels" (merge (deepCopy .) (dict "component" "gateway")) | nindent 4 }}
{{- end }}
{{- if and .Values.gateway.enabled .Values.gateway.dashboard.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermes.fullname" . }}-dashboard
  labels:
    {{- include "hermes.componentLabels" (merge (deepCopy .) (dict "component" "dashboard")) | nindent 4 }}
  {{- $ann := merge (deepCopy (.Values.gateway.dashboard.service.annotations | default dict)) (.Values.commonAnnotations | default dict) }}
  {{- if $ann }}
  annotations:
    {{- toYaml $ann | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.dashboard.service.type }}
  ports:
    {{- $tp := .Values.gateway.dashboard.service.targetPort }}
    {{- $numeric := regexMatch "^[0-9]+$" (toString $tp) }}
    - name: dashboard
      port: {{ .Values.gateway.dashboard.service.port }}
      targetPort: {{ if $numeric }}{{ int $tp }}{{ else }}{{ $tp }}{{ end }}
      protocol: TCP
    {{- range .Values.gateway.dashboard.service.extraPorts }}
    - {{ toYaml . | nindent 6 | trimPrefix "  " }}
    {{- end }}
  selector:
    {{- include "hermes.componentSelectorLabels" (merge (deepCopy .) (dict "component" "gateway")) | nindent 4 }}
{{- end }}
