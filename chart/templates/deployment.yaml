{{- $root := . }}
{{- $components := list (dict "name" "gateway" "values" .Values.gateway) (dict "name" "dashboard" "values" .Values.dashboard) }}
{{- range $components }}
{{- if .values.enabled }}
{{- $component := .name }}
{{- $compValues := .values }}
{{- with $root }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes.fullname" . }}-{{ $component }}
  labels:
    {{- include "hermes.componentLabels" (merge (deepCopy .) (dict "component" $component)) | nindent 4 }}
  {{- with $compValues.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $compValues.replicaCount }}
  {{- if and $compValues.persistence.enabled (gt (int $compValues.replicaCount) 1) }}
  {{- fail (printf "%s.persistence is a ReadWriteOnce volume that can attach to only one pod at a time. Set %s.replicaCount: 1, or switch to ReadWriteMany / external storage before scaling." $component $component) }}
  {{- end }}
  {{- if $compValues.strategy }}
  strategy:
    {{- toYaml $compValues.strategy | nindent 4 }}
  {{- else if $compValues.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "hermes.componentSelectorLabels" (merge (deepCopy .) (dict "component" $component)) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hermes.componentLabels" (merge (deepCopy .) (dict "component" $component)) | nindent 8 }}
        {{- with $compValues.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $podAnnotations := include "hermes.podAnnotations" (merge (deepCopy .) (dict "component" $component)) | fromYaml }}
      {{- if $podAnnotations }}
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      {{- with $compValues.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      serviceAccountName: {{ include "hermes.serviceAccountName" (merge (deepCopy .) (dict "component" $component)) }}
      {{- with $compValues.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $compValues.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $compValues.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $compValues.persistence.enabled $compValues.extraVolumes }}
      volumes:
        {{- if $compValues.persistence.enabled }}
        - name: {{ $component }}-data
          persistentVolumeClaim:
            claimName: {{ if $compValues.persistence.existingClaim }}{{ $compValues.persistence.existingClaim }}{{ else }}{{ include "hermes.fullname" . }}-{{ $component }}{{ end }}
        {{- end }}
        {{- with $compValues.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: "{{ $compValues.image.repository }}:{{ $compValues.image.tag }}"
          imagePullPolicy: {{ $compValues.image.pullPolicy }}
          {{- with $compValues.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $compValues.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $compValues.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- toYaml $compValues.ports | nindent 12 }}
          {{- if or $compValues.env $compValues.persistence.enabled }}
          env:
            {{- if $compValues.persistence.enabled }}
            - name: HERMES_HOME
              value: {{ $compValues.persistence.mountPath | quote }}
            {{- end }}
            {{- with $compValues.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- $envFrom := list }}
          {{- if .Values.config.enabled }}
          {{- $envFrom = append $envFrom (dict "configMapRef" (dict "name" (include "hermes.fullname" .))) }}
          {{- end }}
          {{- if .Values.secret.enabled }}
          {{- $envFrom = append $envFrom (dict "secretRef" (dict "name" (include "hermes.fullname" .))) }}
          {{- end }}
          {{- $envFrom = concat $envFrom (default (list) $compValues.envFrom) }}
          {{- if $envFrom }}
          envFrom:
            {{- toYaml $envFrom | nindent 12 }}
          {{- end }}
          {{- with $compValues.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $compValues.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $compValues.startupProbe }}
          startupProbe:
            {{- toYaml $compValues.startupProbe | nindent 12 }}
          {{- else if $compValues.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ $compValues.livenessProbe.path }}
              port: {{ $compValues.livenessProbe.port }}
            initialDelaySeconds: {{ $compValues.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $compValues.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $compValues.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ $compValues.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if $compValues.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ $compValues.readinessProbe.path }}
              port: {{ $compValues.readinessProbe.port }}
            initialDelaySeconds: {{ $compValues.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ $compValues.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ $compValues.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ $compValues.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if or $compValues.persistence.enabled $compValues.extraVolumeMounts }}
          volumeMounts:
            {{- if $compValues.persistence.enabled }}
            - name: {{ $component }}-data
              mountPath: {{ $compValues.persistence.mountPath }}
              {{- if $compValues.persistence.subPath }}
              subPath: {{ $compValues.persistence.subPath }}
              {{- end }}
            {{- end }}
            {{- with $compValues.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
