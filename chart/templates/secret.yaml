{{- if .Values.secret.enabled }}
---
apiVersion: v1
kind: Secret
type: {{ .Values.secret.type }}
metadata:
  name: {{ include "hermes.fullname" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
  {{- $ann := merge (deepCopy (.Values.secret.annotations | default dict)) (.Values.commonAnnotations | default dict) }}
  {{- if $ann }}
  annotations:
    {{- toYaml $ann | nindent 4 }}
  {{- end }}
{{- with .Values.secret.data }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .Values.secret.stringData }}
stringData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
