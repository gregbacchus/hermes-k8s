{{- if and .Values.gateway.enabled .Values.gateway.apiServer.enabled }}
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "hermes.fullname" . }}-gateway-test-connection"
  labels:
    {{- include "hermes.componentLabels" (merge (deepCopy .) (dict "component" "gateway")) | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  containers:
    - name: wget
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      workingDir: /tmp
      command: ['wget']
      args: ['--timeout=5', '--tries=1', '-O', '/dev/null', 'http://{{ include "hermes.fullname" . }}-gateway:{{ .Values.gateway.service.port }}{{ .Values.gateway.livenessProbe.path }}']
  restartPolicy: Never
{{- end }}
