{{- $root := . }}
{{- $components := list (dict "name" "gateway" "values" .Values.gateway) (dict "name" "dashboard" "values" .Values.dashboard) }}
{{- $renderedNames := dict }}
{{- range $components }}
{{- if .values.enabled }}
{{- $component := .name }}
{{- with $root }}
{{- if (include "hermes.serviceAccountCreate" (merge (deepCopy .) (dict "component" $component)) | eq "true") }}
{{- $saName := include "hermes.serviceAccountName" (merge (deepCopy .) (dict "component" $component)) }}
{{- if not (hasKey $renderedNames $saName) }}
{{- $_ := set $renderedNames $saName true }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  labels:
    {{- include "hermes.componentLabels" (merge (deepCopy .) (dict "component" $component)) | nindent 4 }}
  {{- with (include "hermes.serviceAccountAnnotations" (merge (deepCopy .) (dict "component" $component)) | fromYaml) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
