{{- $root := . }}
{{- $components := list (dict "name" "gateway" "values" .Values.gateway) (dict "name" "dashboard" "values" .Values.dashboard) }}
{{- range $components }}
{{- if .values.enabled }}
{{- $component := .name }}
{{- with $root }}
{{- if include "hermes.serviceAccountCreate" (merge (deepCopy .) (dict "component" $component)) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hermes.serviceAccountName" (merge (deepCopy .) (dict "component" $component)) }}
  labels:
    {{- include "hermes.componentLabels" (merge (deepCopy .) (dict "component" $component)) | nindent 4 }}
  {{- with (include "hermes.serviceAccountAnnotations" (merge (deepCopy .) (dict "component" $component)) | fromYaml) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
