name: helm-lint

on:
  push:
    branches: [main]
    paths: ['chart/**', 'README.md']
  pull_request:
    paths: ['chart/**', 'README.md']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint chart
        run: helm lint ./chart
      - name: Template chart
        run: helm template hermes ./chart > /tmp/render.yaml
      - name: Validate schema
        run: |
          kubectl apply --dry-run=client --validate=true -f /tmp/render.yaml
      - name: Assert services define ports
        run: |
          python3 -c "
          import re, sys
          docs = open('/tmp/render.yaml').read().split('---')
          services = [d for d in docs if re.search(r'^kind:\s*Service\s*$', d, re.M)]
          assert services, 'no Services rendered'
          for d in services:
              if not re.search(r'^  ports:\s*$', d, re.M):
                  sys.exit('ERROR: Service without ports block rendered')
          print(f'OK: {len(services)} Service(s) all define ports')
          "
      - name: Assert test hooks target a health path and run unprivileged
        run: |
          python3 -c "
          import re, sys
          docs = open('/tmp/render.yaml').read().split('---')
          hooks = [d for d in docs if re.search(r'\"helm.sh/hook\": test', d)]
          assert hooks, 'no test hook pods rendered'
          for d in hooks:
              assert re.search(r'runAsUser:\s*1000', d), 'hook must run unprivileged'
              assert re.search(r'workdir:\s*/tmp|workingDir:\s*/tmp', d, re.I), 'hook needs writable cwd'
              args = re.search(r'args:.*?(?=restartPolicy|\Z)', d, re.S)
              assert args and '-O' in args.group(0) and '/dev/null' in args.group(0), 'hook wget must discard body via -O /dev/null'
              assert re.search(r'/healthz|\$\{livenessProbe', d) or 'livenessProbe.path' in d, 'hook must target a health path'
          print(f'OK: {len(hooks)} test hook(s) target health path unprivileged')
          "
      - name: Assert config/secret are wired into Deployments
        run: |
          helm template hermes ./chart \
            --set config.enabled=true \
            --set secret.enabled=true > /tmp/render-envfrom.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-envfrom.yaml').read().split('---')
          deps = [d for d in docs if re.search(r'^kind:\s*Deployment\s*$', d, re.M)]
          assert deps, 'no Deployments rendered'
          for d in deps:
              assert 'configMapRef' in d and 'name: hermes' in d, 'Deployment missing configMapRef envFrom'
              assert 'secretRef' in d and 'name: hermes' in d, 'Deployment missing secretRef envFrom'
          print(f'OK: {len(deps)} Deployment(s) wired to shared config/secret')
          "
      - name: Assert NetworkPolicy allows same-namespace ingress
        run: |
          helm template hermes ./chart \
            --set networkPolicy.enabled=true > /tmp/render-netpol.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-netpol.yaml').read().split('---')
          nps = [d for d in docs if re.search(r'^kind:\s*NetworkPolicy\s*$', d, re.M)]
          assert nps, 'no NetworkPolicies rendered'
          for d in nps:
              ingress = re.search(r'^  ingress:(.*?)(?=^  egress:)', d, re.S | re.M)
              assert ingress and 'podSelector' in ingress.group(1), 'NetworkPolicy missing same-namespace ingress rule'
          print(f'OK: {len(nps)} NetworkPolicy(ies) allow same-namespace ingress')
          "
      - name: Validate strict schema (kubeconform)
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /tmp
          /tmp/kubeconform -strict -summary -output pretty /tmp/render.yaml
      - name: Validate ingress variants (kubeconform)
        run: |
          helm template hermes ./chart \
            --set ingress.enabled=true > /tmp/render-ingress-default.yaml
          helm template hermes ./chart \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set 'ingress.hosts[0].host=hermes.example.com' > /tmp/render-ingress-readme.yaml
          for f in /tmp/render-ingress-default.yaml /tmp/render-ingress-readme.yaml; do
            python3 -c "
            import re, sys
            docs = open('$f').read().split('---')
            for d in docs:
                if not re.search(r'^kind:\s*Ingress\s*$', d, re.M):
                    continue
                paths = re.findall(r'^\s*- path:\s*', d, re.M)
                assert paths, 'ERROR: Ingress rendered with no paths'
            print('OK: Ingress defines paths in $f')
            "
            /tmp/kubeconform -strict -summary -output pretty "$f"
          done
