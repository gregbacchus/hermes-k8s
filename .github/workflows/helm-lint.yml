name: helm-lint

on:
  push:
    branches: [main]
    paths: ['chart/**', 'README.md']
  pull_request:
    paths: ['chart/**', 'README.md']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint chart
        run: helm lint ./chart
      - name: Template chart
        run: helm template hermes ./chart > /tmp/render.yaml
      - name: Assert exactly one StatefulSet and zero Deployments
        run: |
          python3 -c "
          import re, sys
          docs = open('/tmp/render.yaml').read().split('---')
          sts = [d for d in docs if re.search(r'^kind:\s*StatefulSet\s*$', d, re.M)]
          deps = [d for d in docs if re.search(r'^kind:\s*Deployment\s*$', d, re.M)]
          assert len(sts) == 1, 'expected exactly one StatefulSet'
          assert not deps, 'must not render any Deployment (gateway is a StatefulSet)'
          assert 'serviceName:' in sts[0], 'StatefulSet must set serviceName (governing Service)'
          print('OK: exactly one StatefulSet rendered, zero Deployments')
          "
      - name: Assert short API key fails to render
        run: |
          if helm template hermes ./chart --set gateway.apiServer.enabled=true --set gateway.apiServer.key=shortkey > /tmp/render-shortkey.yaml 2>/dev/null; then
            echo "ERROR: helm template must fail for an API key shorter than 16 characters"
            exit 1
          fi
          echo "OK: short API key rejected at render time"
      - name: Assert keySecretRef skips the short-key render guard
        run: |
          helm template hermes ./chart \
            --set gateway.apiServer.enabled=true \
            --set gateway.apiServer.key=shortkey \
            --set gateway.apiServer.keySecretRef.name=my-secret > /tmp/render-keyref.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-keyref.yaml').read().split('---')
          deps = [d for d in docs if re.search(r'^kind:\s*StatefulSet\s*$', d, re.M)]
          assert deps, 'no StatefulSet rendered'
          assert 'secretKeyRef' in deps[0] and 'name: my-secret' in deps[0], 'must prefer keySecretRef over plaintext key'
          print('OK: short key + keySecretRef.name renders (guard skipped)')
          "
      - name: Assert apiServer.enabled=false gates probes/test hook and sets API_SERVER_ENABLED=false
        run: |
          helm template hermes ./chart \
            --set gateway.apiServer.enabled=false > /tmp/render-apiserver-off.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-apiserver-off.yaml').read().split('---')
          deps = [d for d in docs if re.search(r'^kind:\s*StatefulSet\s*$', d, re.M)]
          assert deps, 'no StatefulSet rendered'
          gw = deps[0]
          assert 'livenessProbe' not in gw and 'readinessProbe' not in gw and 'startupProbe' not in gw, 'probes must be gated on apiServer.enabled'
          assert re.search(r'name: API_SERVER_ENABLED\s*\n\s*value: \"false\"', gw), 'must set API_SERVER_ENABLED=false when disabled'
          assert not [d for d in docs if re.search(r'\"helm.sh/hook\": test', d)], 'test hook must be gated on apiServer.enabled'
          print('OK: apiServer.enabled=false gates probes + test hook and sets API_SERVER_ENABLED=false')
          "
      - name: Assert gateway.args renders (no command override) — ENTRYPOINT preserved
        run: |
          helm template hermes ./chart > /tmp/render-cmdargs.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-cmdargs.yaml').read().split('---')
          sts = [d for d in docs if re.search(r'^kind:\s*StatefulSet\s*$', d, re.M)]
          assert len(sts) == 1, 'expected exactly one StatefulSet'
          gw = sts[0]
          # The chart must never render `command:` — it overrides the image ENTRYPOINT
          # (the s6-overlay dispatcher) and makes the kubelet exec a nonexistent binary.
          assert not re.search(r'^\s*command:\s*\$', gw, re.M), 'StatefulSet must not set command (ENTRYPOINT override breaks the image)'
          assert re.search(r'args:\s*\n\s*- gateway\s*\n\s*- run', gw), 'StatefulSet must render args: [gateway, run]'
          print('OK: gateway runs via args (no command override), ENTRYPOINT preserved')
          "
      - name: Assert gateway.command render guard fails
        run: |
          if helm template hermes ./chart --set-json 'gateway.command=["gateway","run"]' > /tmp/render-command.yaml 2>/dev/null; then
            echo "ERROR: helm template must fail when gateway.command is set"
            exit 1
          fi
          echo "OK: gateway.command is rejected at render time"
      - name: Assert startupProbe does not drop the liveness probe
        run: |
          helm template hermes ./chart \
            --set gateway.apiServer.enabled=true \
            --set gateway.startupProbe.httpGet.path=/health \
            --set gateway.startupProbe.httpGet.port=api > /tmp/render-startup.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-startup.yaml').read().split('---')
          sts = [d for d in docs if re.search(r'^kind:\s*StatefulSet\s*$', d, re.M)]
          assert sts, 'no StatefulSet rendered'
          gw = sts[0]
          assert re.search(r'startupProbe:\s*\$', gw, re.M), 'startupProbe must render when set'
          assert re.search(r'livenessProbe:\s*\$', gw, re.M), 'livenessProbe must still render alongside startupProbe'
          print('OK: startupProbe and livenessProbe render together')
          "
      - name: Assert numeric targetPort renders a string Service port name
        run: |
          helm template hermes ./chart \
            --set gateway.service.targetPort=8642 > /tmp/render-numport.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-numport.yaml').read().split('---')
          svc = [d for d in docs if re.search(r'^kind:\s*Service\s*$', d, re.M) and 'name: hermes-gateway' in d]
          assert svc, 'no gateway Service rendered'
          assert re.search(r'name:\s*\"8642\"', svc[0]), 'numeric targetPort must render a string port name'
          assert re.search(r'targetPort:\s*8642\s*\$', svc[0], re.M), 'numeric targetPort must render as an integer'
          assert not re.search(r'name:\s*8642\s*\$', svc[0], re.M), 'port name must be a string, not a bare integer'
          print('OK: numeric targetPort renders a string name + integer targetPort')
          "
      - name: Assert ingress quoted numeric port renders number
        run: |
          cat > /tmp/ingress-port-string.yaml <<'YAML'
          ingress:
            enabled: true
            hosts:
              - host: hermes.example.com
                paths:
                  - path: /
                    pathType: Prefix
                    service: gateway
                    port: "8642"
          YAML
          helm template hermes ./chart -f /tmp/ingress-port-string.yaml > /tmp/render-ingress-strport.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-ingress-strport.yaml').read().split('---')
          ing = [d for d in docs if re.search(r'^kind:\s*Ingress\s*$', d, re.M)]
          assert ing, 'no Ingress rendered'
          assert re.search(r'number:\s*8642', ing[0]), 'quoted numeric port must render number: 8642'
          assert 'name: \"8642\"' not in ing[0], 'quoted numeric port must not render as a name'
          print('OK: quoted numeric ingress port renders number: 8642')
          "
      - name: Validate schema
        run: |
          kubectl apply --dry-run=client --validate=true -f /tmp/render.yaml
      - name: Assert services define ports
        run: |
          python3 -c "
          import re, sys
          docs = open('/tmp/render.yaml').read().split('---')
          services = [d for d in docs if re.search(r'^kind:\s*Service\s*$', d, re.M)]
          assert services, 'no Services rendered'
          for d in services:
              if not re.search(r'^  ports:\s*$', d, re.M):
                  sys.exit('ERROR: Service without ports block rendered')
          print(f'OK: {len(services)} Service(s) all define ports')
          "
      - name: Assert test hook targets /health and runs unprivileged
        run: |
          helm template hermes ./chart \
            --set gateway.apiServer.enabled=true > /tmp/render-hook.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-hook.yaml').read().split('---')
          hooks = [d for d in docs if re.search(r'\"helm.sh/hook\": test', d)]
          assert hooks, 'no test hook pods rendered'
          for d in hooks:
              assert re.search(r'runAsUser:\s*1000', d), 'hook must run unprivileged'
              assert re.search(r'workingDir:\s*/tmp', d), 'hook needs writable cwd'
              args = re.search(r'args:.*?(?=restartPolicy|\Z)', d, re.S)
              assert args and '-O' in args.group(0) and '/dev/null' in args.group(0), 'hook wget must discard body via -O /dev/null'
              assert re.search(r'/health\b', d), 'hook must target the API server /health path'
          print(f'OK: {len(hooks)} test hook(s) target /health unprivileged')
          "
      - name: Assert config/secret are wired into the StatefulSet
        run: |
          helm template hermes ./chart \
            --set config.enabled=true \
            --set secret.enabled=true > /tmp/render-envfrom.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-envfrom.yaml').read().split('---')
          deps = [d for d in docs if re.search(r'^kind:\s*StatefulSet\s*$', d, re.M)]
          assert len(deps) == 1, 'expected exactly one StatefulSet'
          assert 'configMapRef' in deps[0] and 'name: hermes' in deps[0], 'StatefulSet missing configMapRef envFrom'
          assert 'secretRef' in deps[0] and 'name: hermes' in deps[0], 'StatefulSet missing secretRef envFrom'
          print('OK: StatefulSet wired to shared config/secret')
          "
      - name: Assert gateway.envFrom=null renders (concat nil-safety)
        run: |
          helm template hermes ./chart \
            --set config.enabled=true \
            --set secret.enabled=true \
            --set gateway.envFrom=null > /tmp/render-envfrom-null.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-envfrom-null.yaml').read().split('---')
          deps = [d for d in docs if re.search(r'^kind:\s*StatefulSet\s*$', d, re.M)]
          assert deps and 'configMapRef' in deps[0], 'StatefulSet missing configMapRef envFrom'
          print('OK: StatefulSet still wired with gateway.envFrom=null')
          "
      - name: Assert gateway persistence (PVC + HERMES_HOME + fsGroup 10000)
        run: |
          helm template hermes ./chart > /tmp/render-pvc.yaml
          helm template hermes ./chart \
            --set gateway.persistence.existingClaim=hermes-data > /tmp/render-existingclaim.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-pvc.yaml').read().split('---')
          pvcs = [d for d in docs if re.search(r'^kind:\s*PersistentVolumeClaim\s*$', d, re.M)]
          assert len(pvcs) == 1, 'expected exactly one default PVC (gateway persistence)'
          assert re.search(r'helm\.sh/resource-policy:\s*keep', pvcs[0]), 'PVC must be annotated helm.sh/resource-policy: keep (uninstall must not destroy state)'
          deps = [d for d in docs if re.search(r'^kind:\s*StatefulSet\s*$', d, re.M)]
          assert len(deps) == 1, 'expected exactly one StatefulSet'
          gw = deps[0]
          assert 'serviceName:' in gw, 'StatefulSet must set serviceName (governing Service)'
          assert 'updateStrategy:' in gw and 'type: RollingUpdate' in gw, 'gateway must use RollingUpdate updateStrategy'
          assert 'HERMES_HOME' in gw and '/opt/data' in gw, 'gateway must set HERMES_HOME=/opt/data'
          assert 'persistentVolumeClaim' in gw, 'gateway must mount the PVC'
          assert 'fsGroup: 10000' in gw, 'gateway pod must set fsGroup: 10000'
          assert 'readOnlyRootFilesystem: true' in gw, 'gateway must use a read-only root filesystem'
          assert 'scratch-run' in gw and 'mountPath: /run' in gw, 'gateway needs a writable /run scratch mount'
          assert 'scratch-tmp' in gw and 'mountPath: /tmp' in gw, 'gateway needs a writable /tmp scratch mount'
          docs2 = open('/tmp/render-existingclaim.yaml').read().split('---')
          assert not [d for d in docs2 if re.search(r'^kind:\s*PersistentVolumeClaim\s*$', d, re.M)], 'existingClaim must suppress chart PVC'
          assert 'claimName: hermes-data' in open('/tmp/render-existingclaim.yaml').read(), 'existingClaim name must be used'
          print('OK: persistence PVC + HERMES_HOME + fsGroup 10000 + scratch mounts wired')
          "
      - name: Assert persistence.enabled=false emits emptyDir and a loud NOTES warning
        run: |
          helm template hermes ./chart \
            --set gateway.persistence.enabled=false > /tmp/render-nopersist.yaml
          helm install hermes ./chart --dry-run \
            --set gateway.persistence.enabled=false > /tmp/notes-nopersist.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-nopersist.yaml').read().split('---')
          assert not [d for d in docs if re.search(r'^kind:\s*PersistentVolumeClaim\s*$', d, re.M)], 'persistence.enabled=false must render no PVC'
          deps = [d for d in docs if re.search(r'^kind:\s*StatefulSet\s*$', d, re.M)]
          assert deps, 'no StatefulSet rendered'
          gw = deps[0]
          assert re.search(r'- name: gateway-data\s*\n\s*emptyDir:\s*\{\}', gw), 'persistence.enabled=false must mount an emptyDir at the state path'
          assert 'persistentVolumeClaim' not in gw, 'persistence.enabled=false must not reference a PVC'
          notes = open('/tmp/notes-nopersist.yaml').read()
          assert 'gateway.persistence.enabled is false' in notes, 'NOTES must warn loudly when persistence is disabled'
          print('OK: persistence.enabled=false emits emptyDir and a loud NOTES warning')
          "
      - name: Assert PVC carries the keep resource-policy annotation
        run: |
          helm template hermes ./chart > /tmp/render-pvc-keep.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-pvc-keep.yaml').read().split('---')
          pvcs = [d for d in docs if re.search(r'^kind:\s*PersistentVolumeClaim\s*$', d, re.M)]
          assert len(pvcs) == 1, 'expected exactly one default PVC'
          assert re.search(r'helm\.sh/resource-policy:\s*keep', pvcs[0]), 'PVC must carry helm.sh/resource-policy: keep'
          print('OK: PVC annotated helm.sh/resource-policy: keep')
          "
      - name: Assert container securityContext capability contract
        run: |
          helm template hermes ./chart > /tmp/render-seccomp.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-seccomp.yaml').read().split('---')
          deps = [d for d in docs if re.search(r'^kind:\s*StatefulSet\s*$', d, re.M)]
          assert deps, 'no StatefulSet rendered'
          gw = deps[0]
          assert 'allowPrivilegeEscalation: false' in gw, 'must set allowPrivilegeEscalation: false'
          # The s6 bootstrap needs CHOWN/DAC_OVERRIDE/SETGID/SETUID; a bare drop of ALL
          # (no add back) crashes the image at boot (s6-applyuidgid exits 111).
          assert '- ALL' in gw, 'capabilities must drop ALL'
          for cap in ['CHOWN', 'DAC_OVERRIDE', 'SETGID', 'SETUID']:
              assert ('- ' + cap) in gw, f'capabilities must add back {cap} (s6 bootstrap)'
          print('OK: container capability contract pinned (drop ALL + bootstrap caps)')
          "
      - name: Assert image contract (nousresearch/hermes-agent, ports 8642/9119)
        run: |
          helm template hermes ./chart \
            --set gateway.dashboard.enabled=true > /tmp/render-image.yaml
          python3 -c "
          import re, sys
          docs = open('/tmp/render-image.yaml').read().split('---')
          deps = [d for d in docs if re.search(r'^kind:\s*StatefulSet\s*$', d, re.M)]
          gw = deps[0]
          assert 'nousresearch/hermes-agent' in gw, 'gateway must use nousresearch/hermes-agent image'
          assert 'containerPort: 8642' in gw, 'gateway must expose port 8642 (api)'
          assert 'containerPort: 9119' in gw, 'dashboard must expose port 9119'
          assert 'API_SERVER_ENABLED' in gw and 'HERMES_DASHBOARD' in gw, 'env wiring missing'
          services = [d for d in docs if re.search(r'^kind:\s*Service\s*$', d, re.M)]
          assert any('name: hermes-gateway' in d and 'port: 8642' in d for d in services), 'gateway service must be 8642'
          assert any('name: hermes-dashboard' in d and 'port: 9119' in d for d in services), 'dashboard service must be 9119'
          print('OK: image/ports contract verified')
          "
      - name: Validate strict schema (kubeconform)
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /tmp
          /tmp/kubeconform -strict -summary -output pretty /tmp/render.yaml
          /tmp/kubeconform -strict -summary -output pretty /tmp/render-image.yaml
      - name: Validate ingress variants (kubeconform)
        run: |
          helm template hermes ./chart \
            --set ingress.enabled=true > /tmp/render-ingress-default.yaml
          helm template hermes ./chart \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set 'ingress.hosts[0].host=hermes.example.com' > /tmp/render-ingress-readme.yaml
          for f in /tmp/render-ingress-default.yaml /tmp/render-ingress-readme.yaml; do
            /tmp/kubeconform -strict -summary -output pretty "$f"
          done

  smoke:
    # Runtime evidence: the real Hermes image boots against an empty volume UNDER THE
    # CHART'S OWN securityContext (capabilities dropped to the bootstrap set, read-only
    # rootfs, disk-backed /run and /tmp scratch, no-new-privileges) and writes config.yaml
    # + state.db (SQLite) owned by uid 10000 — proving the persistence and securityContext
    # contract the chart encodes. It must not run with default caps, or it would pass even
    # though the chart's `drop: [ALL]` default (if misconfigured) crashloops the pod.
    runs-on: ubuntu-latest
    steps:
      - name: Pull Hermes image
        run: docker pull nousresearch/hermes-agent:latest
      - name: Boot gateway against an empty volume (chart securityContext)
        run: |
          mkdir -p /tmp/hermes-smoke/data /tmp/hermes-smoke/run /tmp/hermes-smoke/tmp
          # Boot the image EXACTLY as the chart ships it: the image ENTRYPOINT (s6-overlay
          # dispatcher) is preserved and the rendered `args` are appended as CMD. Do NOT use
          # `--entrypoint` (the chart must never render a `command` override — the ENTRYPOINT
          # is mandatory) and do NOT rely on `docker run image gateway run` semantics, which
          # would mask a `command:` override bug in the rendered StatefulSet.
          docker run -d --name hermes-smoke \
            -v /tmp/hermes-smoke/data:/opt/data \
            -v /tmp/hermes-smoke/run:/run \
            -v /tmp/hermes-smoke/tmp:/tmp \
            -e API_SERVER_ENABLED=true \
            -e API_SERVER_HOST=0.0.0.0 \
            -e API_SERVER_KEY=testkey1234567890 \
            --cap-drop=ALL --cap-add=CHOWN --cap-add=DAC_OVERRIDE --cap-add=SETGID --cap-add=SETUID \
            --read-only --security-opt no-new-privileges \
            nousresearch/hermes-agent:latest gateway run
      - name: Assert state files written as uid 10000
        run: |
          for i in $(seq 1 36); do
            if docker exec hermes-smoke sh -c 'test -f /opt/data/state.db && test -f /opt/data/config.yaml' 2>/dev/null; then
              break
            fi
            sleep 5
          done
          docker exec hermes-smoke sh -c '
            set -e
            test -f /opt/data/state.db && echo "state.db: present" || { echo "state.db MISSING"; exit 1; }
            test -f /opt/data/config.yaml && echo "config.yaml: present" || { echo "config.yaml MISSING"; exit 1; }
            test -f /opt/data/SOUL.md && echo "SOUL.md: present"
            uid=$(stat -c %u /opt/data/state.db)
            [ "$uid" = 10000 ] && echo "state.db uid=10000 OK" || { echo "state.db uid=$uid (want 10000)"; exit 1; }
            echo "state-write smoke passed"
          '
      - name: Assert API server /health returns HTTP 200
        run: |
          for i in $(seq 1 60); do
            code=$(docker exec hermes-smoke curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:8642/health 2>/dev/null || true)
            if [ "$code" = "200" ]; then
              echo "OK: /health returned HTTP 200 with a 16-char API key"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: /health never returned HTTP 200 (last code: ${code:-none})"
          docker logs hermes-smoke 2>&1 | tail -50 || true
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f hermes-smoke || true
