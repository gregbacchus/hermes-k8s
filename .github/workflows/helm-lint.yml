name: helm-lint

on:
  push:
    branches: [main]
    paths: ['chart/**', 'README.md']
  pull_request:
    paths: ['chart/**', 'README.md']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint chart
        run: helm lint ./chart
      - name: Template chart
        run: helm template hermes ./chart > /tmp/render.yaml
      - name: Validate schema
        run: |
          kubectl apply --dry-run=client --validate=true -f /tmp/render.yaml
      - name: Assert services define ports
        run: |
          python3 -c "
          import re, sys
          docs = open('/tmp/render.yaml').read().split('---')
          services = [d for d in docs if re.search(r'^kind:\s*Service\s*$', d, re.M)]
          assert services, 'no Services rendered'
          for d in services:
              if not re.search(r'^  ports:\s*$', d, re.M):
                  sys.exit('ERROR: Service without ports block rendered')
          print(f'OK: {len(services)} Service(s) all define ports')
          "
      - name: Validate strict schema (kubeconform)
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /tmp
          /tmp/kubeconform -strict -summary -output pretty /tmp/render.yaml
      - name: Validate ingress variants (kubeconform)
        run: |
          helm template hermes ./chart \
            --set ingress.enabled=true > /tmp/render-ingress-default.yaml
          helm template hermes ./chart \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set 'ingress.hosts[0].host=hermes.example.com' > /tmp/render-ingress-readme.yaml
          for f in /tmp/render-ingress-default.yaml /tmp/render-ingress-readme.yaml; do
            python3 -c "
            import re, sys
            docs = open('$f').read().split('---')
            for d in docs:
                if not re.search(r'^kind:\s*Ingress\s*$', d, re.M):
                    continue
                paths = re.findall(r'^\s*- path:\s*', d, re.M)
                assert paths, 'ERROR: Ingress rendered with no paths'
            print('OK: Ingress defines paths in $f')
            "
            /tmp/kubeconform -strict -summary -output pretty "$f"
          done
